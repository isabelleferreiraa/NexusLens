name: NexusLens 2.0 - Frontend

on:
  pull_request:
  push:
    branches:
      - main
      - feat/nexuslens-v2-polimento

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Testes do frontend
        run: node --test tests/*.test.mjs

      - name: ESLint
        run: npm run lint

      - name: Build Vite
        run: npm run build
